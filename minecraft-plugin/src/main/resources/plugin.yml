name: EmeraldPerks
version: "1.9.0"
main: dev.dailyemerald.perks.EmeraldPerksPlugin
api-version: "1.21"
description: Patreon-powered perks - patron morphing and goat horns for DailyEmerald.
author: DailyEmerald

commands:
  patreon:
    description: Link your Patreon account and manage perks.
    usage: /patreon <link|unlink|status>
    aliases: [perks]
  morph:
    description: Morph into a mob (patron perk).
    usage: /morph <mob>
  unmorph:
    description: Change back to yourself.
    usage: /unmorph
  morphview:
    description: Toggle whether you see your own morph (so it doesn't block your aim).
    usage: /morphview
  nation:
    description: Sign up for a nation/team (works in adventure mode).
    usage: /nation <join|leave|list>
    aliases: [nations]

permissions:
  emeraldperks.admin:
    description: Manage patron perks (/patreon sync, set, horn).
    default: op
  emeraldperks.morph.all:
    description: Morph into any allowed mob regardless of Patreon role.
    default: op
  emeraldperks.priority:
    description: Never gets kicked to make room for a priority join.
    default: false
  emeraldperks.nation.admin:
    description: Create and delete nations (/nation create, /nation delete).
    default: op
